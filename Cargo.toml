[package]
authors = ["Steve Pryde <spryde81@gmail.com>"]
edition = "2024"
name = "rustonator"
version = "0.2.0"

[dependencies]
futures = "0.3"
rand = "0.9"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tungstenite = "0.26"

## Flamegraph profiling
#[profile.release]
#debug = true
