name: Deploy Rustonator

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        type: choice
        options:
          - all
          - servers
          - game-server
          - scores-server
          - client

jobs:
  game-server:
    if: contains(fromJSON('["all", "servers", "game-server"]'), inputs.target)
    uses: ./.github/workflows/_deploy.yml
    with:
      cargo_package: game-server
      env_vars: |
        SCORES_URL=${{ vars.SCORES_URL }}
      service_name: game_server
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SCORES_SECRET: ${{ secrets.SCORES_SECRET }}

  scores-server:
    if: contains(fromJSON('["all", "servers", "scores-server"]'), inputs.target)
    uses: ./.github/workflows/_deploy.yml
    with:
      cargo_package: scores-server
      env_vars: |
        SCORES_FILE=/var/lib/scores_server/scores.json
      service_name: scores_server
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SCORES_SECRET: ${{ secrets.SCORES_SECRET }}

  client:
    if: contains(fromJSON('["all", "client"]'), inputs.target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: client
        run: bun install

      - name: Build client
        working-directory: client
        run: bun run build

      - name: Deploy to Cloudflare Pages
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/ --project-name=rustonator --branch=main
